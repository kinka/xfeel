<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>xfeel 数据仪表盘</title>
<style>
:root{--bg:#0a0e17;--card:#111827;--panel:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--blue:#58a6ff;--green:#3fb950;--red:#f97583;--orange:#f0883e;--purple:#d2a8ff;--cyan:#06b6d4;--yellow:#d29922}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.header{position:sticky;top:0;z-index:10;background:rgba(10,14,23,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 22px}.header-inner{max-width:1280px;margin:0 auto;display:flex;gap:18px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0;background:linear-gradient(135deg,var(--blue),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.sub{color:var(--muted);font-size:11px}.stats-row{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}.stat-pill{background:var(--card);border:1px solid var(--border);border-radius:999px;padding:4px 10px}.stat-pill b{color:var(--blue)}.tabs{max-width:1280px;margin:0 auto;padding:10px 22px 0;display:flex;gap:4px;overflow:auto}.tab-btn,.btn,button{background:#21262d;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 12px;cursor:pointer}.tab-btn{background:transparent;color:var(--muted);border-color:transparent;border-bottom:none;border-radius:8px 8px 0 0}.tab-btn.active,.btn.active{color:var(--blue);background:var(--card);border-color:var(--border)}.content{max-width:1280px;margin:0 auto;padding:0 22px 36px}.tab-panel{display:none}.tab-panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin:14px 0;overflow:hidden}.card h2{font-size:14px;margin:0 0 12px;color:var(--text)}.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.metric{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px}.metric .num{font-size:28px;font-weight:800;color:var(--blue)}.metric .label{color:var(--muted);font-size:12px}.heatmap{display:grid;gap:3px;overflow:auto}.heat-row{display:grid;grid-template-columns:90px repeat(var(--cols),28px);gap:3px;align-items:center}.cell{height:24px;border-radius:4px;background:#21262d;text-align:center;font-size:9px;line-height:24px}.timeline{display:flex;flex-direction:column;gap:10px}.event-row{border-left:3px solid var(--blue);background:var(--panel);border-radius:8px;padding:10px 12px}.event-title{font-weight:700}.event-meta{color:var(--muted);font-size:11px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.tag{border:1px solid var(--border);border-radius:999px;padding:2px 7px;color:var(--muted);font-size:11px}.owner-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px}.bar{height:8px;background:#21262d;border-radius:99px;overflow:hidden}.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--purple))}#graph-svg{width:100%;height:650px;background:radial-gradient(circle at 50% 35%,#172033 0,#0d1117 65%);border:1px solid var(--border);border-radius:12px}.node text{fill:#e6edf3;font-size:11px;paint-order:stroke;stroke:#0d1117;stroke-width:3px}.node circle{stroke:#fff;stroke-opacity:.4}.link{stroke:#8b949e;stroke-opacity:.38}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.kv{display:flex;justify-content:space-between;border-bottom:1px solid #26303b;padding:5px 0}.search{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:#0d1117;color:var(--text);margin-bottom:10px}.ok{color:var(--green)}.err{color:var(--red)}.media-wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.media-cell{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden}.media-cell img{width:100%;height:160px;object-fit:cover;display:block;background:#0d1117}.media-meta{color:var(--muted);font-size:11px;padding:6px 8px 0}.media-cap{padding:4px 8px 8px;font-size:12px}
</style>
</head>
<body>
<div class="header"><div class="header-inner"><div><h1>📊 xfeel 数据仪表盘</h1><div class="sub">管理员全局视图（<a href="/app" style="color:var(--blue)">用户端</a> · <a href="/conversation/playground" style="color:var(--blue)">调试台</a>），每 <span id="refreshSec">15</span>s 刷新</div></div><div class="stats-row" id="topStats"></div><div class="sub">状态：<span id="status">loading</span> · <span id="updated">-</span></div></div><div class="tabs"><button class="tab-btn active" data-tab="overview">📊 总览</button><button class="tab-btn" data-tab="timeline">📅 时序</button><button class="tab-btn" data-tab="owners">👥 人物/Owner</button><button class="tab-btn" data-tab="data">📚 数据</button><button class="tab-btn" data-tab="media">📷 照片</button></div></div>
<div class="content">
<section class="tab-panel active" id="panel-overview"><div class="card"><div class="metric-grid" id="metrics"></div></div><div class="grid"><div class="card" style="grid-column:span 6"><h2>🔥 情绪热力图</h2><div id="heatmap"></div></div><div class="card" style="grid-column:span 6"><h2>📈 核心情绪趋势</h2><div id="trends"></div></div></div><div class="card"><h2>🏷️ 生活阶段</h2><div id="phases" class="timeline"></div></div></section>
<section class="tab-panel" id="panel-timeline"><div class="card"><h2>📅 最近事件时间线</h2><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"><button class="btn active" data-limit="50">50</button><button class="btn" data-limit="150">150</button><button class="btn" data-limit="400">400</button><select id="ownerEventsSelect" style="background:#0d1117;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 10px"><option value="all">全部</option></select><input type="date" id="timelineSince" title="起始日期" style="background:#0d1117;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 10px;color-scheme:dark"><input type="date" id="timelineUntil" title="结束日期" style="background:#0d1117;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 10px;color-scheme:dark"><span class="sub" id="timelineMeta"></span></div><div id="timeline" class="timeline"></div></div></section>
<section class="tab-panel" id="panel-owners"><div class="card"><h2>👥 爸爸/妈妈视角对比</h2><div id="owners" class="grid"></div></div></section>
<section class="tab-panel" id="panel-data"><div class="card"><h2>📚 日记原文</h2><input id="diarySearch" class="search" placeholder="搜索原文（当前页过滤）"><div id="diaries" class="timeline"></div></div><div class="card"><h2>🏷️ 高频实体 / 情绪 / 标签</h2><div id="lists" class="list"></div></div></section><section class="tab-panel" id="panel-media"><div class="card"><h2>📷 照片墙</h2><div class="sub" style="margin-bottom:10px">家人在微信发来的图片 + 自动转写的日记描述</div><div style="margin-bottom:12px"><select id="ownerMediaSelect" style="background:#0d1117;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 10px"><option value="all">全部用户</option></select></div><div id="mediaWall" class="media-wall"></div></div></section>
</div>
<script src="/web/auth.js"></script>
<script>
const OWNER_LABEL={'demo-dad-owner':'爸爸','demo-mom-owner':'妈妈'}; const refreshSec=15; document.getElementById('refreshSec').textContent=refreshSec;
let state={eventOwner:'all',eventLimit:50,mediaOwner:'all',data:{},events:[],diaries:[],media:[]};
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function ownerLabel(id){return OWNER_LABEL[id]||id||'未知';}
function parseJSON(x,d){try{return typeof x==='string'?JSON.parse(x):(x??d)}catch{return d}}
async function getJSON(path){const r=await window.XFEEL_AUTH.authFetch(path,{cache:'no-store'}); if(!r.ok) throw new Error(path+' '+r.status); return r.json();}
$$('.tab-btn').forEach(b=>b.addEventListener('click',()=>{$$('.tab-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');$$('.tab-panel').forEach(x=>x.classList.remove('active'));$('#panel-'+b.dataset.tab).classList.add('active');}));
$$('[data-limit]').forEach(b=>b.addEventListener('click',()=>{$$('[data-limit]').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.eventLimit=Number(b.dataset.limit);loadEvents();}));
$('#ownerEventsSelect').addEventListener('change',e=>{state.eventOwner=e.target.value;loadEvents();});
$('#ownerMediaSelect').addEventListener('change',e=>{state.mediaOwner=e.target.value;loadMedia();});
/**
 * 切换用户：owner_groups（按家庭分组，含孩子成员）渲染成 <optgroup>——覆盖全库所有用户，
 * 不再是硬编码的爸爸/妈妈两个演示 owner。分组只是视觉归类，下拉里每个用户仍可单独选中。
 */
function renderOwnerFilter(me){
  if(!me.owner_groups||!me.owner_groups.length)return;
  const html='<option value="all">全部用户</option>'+me.owner_groups.map(g=>'<optgroup label="'+esc(g.family_label)+'">'+g.members.map(o=>'<option value="'+esc(o.id)+'">'+esc(o.label)+'</option>').join('')+'</optgroup>').join('');
  $('#ownerEventsSelect').innerHTML=html.replace('全部用户','全部');
  $('#ownerMediaSelect').innerHTML=html;
}
['timelineSince','timelineUntil'].forEach(id=>document.getElementById(id).addEventListener('change',()=>loadEvents().catch(console.error)));
$('#diarySearch').addEventListener('input',renderDiaries);
function mediaQueryURL(){const p=new URLSearchParams({limit:'80'});if(state.mediaOwner!=='all')p.set('owner_id',state.mediaOwner);return '/media/list?'+p.toString();}
async function loadMedia(){const m=await getJSON(mediaQueryURL());state.media=m.media||[];renderMedia();}
async function loadAll(){try{$('#status').textContent='refreshing';$('#status').className='';const [health,stats,summary,heatmap,trends,phases,compare,events,diaries,media]=await Promise.all([getJSON('/health'),getJSON('/stats'),getJSON('/analytics/summary'),getJSON('/analytics/heatmap?months=24'),getJSON('/analytics/trends?top=6'),getJSON('/analytics/phases'),getJSON('/analytics/compare'),getJSON(eventsQueryURL()),getJSON('/diaries?limit=80'),getJSON(mediaQueryURL())]);state.data={health,stats,summary,heatmap,trends,phases,compare};state.events=events.events||[];state.eventsTotal=events.total??state.events.length;state.diaries=diaries.diaries||[];state.media=media.media||[];renderAll();$('#status').textContent='ok';$('#status').className='ok';$('#updated').textContent=new Date().toLocaleTimeString();}catch(e){console.error(e);$('#status').textContent='error: '+e.message;$('#status').className='err';}}
function eventsQueryURL(){const p=new URLSearchParams({limit:String(state.eventLimit)});if(state.eventOwner!=='all')p.set('owner_id',state.eventOwner);const since=document.getElementById('timelineSince')?.value;const until=document.getElementById('timelineUntil')?.value;if(since)p.set('since',since);if(until)p.set('until',until);return '/events?'+p.toString();}
async function loadEvents(){const ev=await getJSON(eventsQueryURL());state.events=ev.events||[];state.eventsTotal=ev.total??state.events.length;renderTimeline();}
function renderAll(){renderMetrics();renderHeatmap();renderTrends();renderPhases();renderOwners();renderLists();renderTimeline();renderDiaries();renderMedia();}
function renderMetrics(){const s=state.data.stats||{},sum=state.data.summary||{};$('#topStats').innerHTML=`<span class="stat-pill">事件 <b>${s.totalEvents??state.data.health?.events??0}</b></span><span class="stat-pill">日记 <b>${state.diaries.length}</b></span><span class="stat-pill">照片 <b>${state.media.length}</b></span>`;$('#metrics').innerHTML=[['记忆事件',s.totalEvents??sum.total_events??0],['活跃月份',sum.active_months??0],['情绪种类',sum.emotion_diversity??0],['照片',state.media.length]].map(([l,n])=>`<div class="metric"><div class="num">${n}</div><div class="label">${l}</div></div>`).join('');}
function renderHeatmap(){const h=state.data.heatmap||{},months=h.months||[],em=h.emotions||[],m=h.matrix||{};document.documentElement.style.setProperty('--cols',String(months.length||1));$('#heatmap').innerHTML=em.slice(0,10).map(e=>`<div class="heat-row"><div class="sub">${esc(e)}</div>${months.map(mon=>{const v=(m[e]?.[mon]??m[mon]?.[e]??0);const a=Math.min(.95,.12+v/12);return `<div class="cell" title="${esc(e)} ${mon}: ${v}" style="background:rgba(88,166,255,${a})">${v||''}</div>`}).join('')}</div>`).join('')||'<div class="sub">暂无热力图数据</div>';}
function renderTrends(){const t=state.data.trends||{},series=t.series||[];$('#trends').innerHTML=series.slice(0,8).map(s=>{const vals=s.values||s.data||[];const max=Math.max(1,...vals.map(v=>typeof v==='number'?v:(v.count||0)));return `<div class="kv"><span>${esc(s.name||s.emotion)}</span><span>${vals.map(v=>{const n=typeof v==='number'?v:(v.count||0);return '▇'.repeat(Math.max(1,Math.round(n/max*8)))}).join(' ')}</span></div>`}).join('')||'<div class="sub">暂无趋势数据</div>';}
function renderPhases(){const arr=Array.isArray(state.data.phases)?state.data.phases:[];$('#phases').innerHTML=arr.slice(-8).reverse().map(p=>`<div class="event-row"><div class="event-title">${esc(p.month||p.period||p.name||'阶段')}</div><div class="event-meta">事件 ${p.event_count??p.count??'-'} · 主情绪 ${esc(p.dominant_emotion||p.emotion||'-')}</div><div class="tags">${(p.top_tags||p.tags||[]).slice(0,8).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></div>`).join('')||'<div class="sub">暂无阶段数据</div>';}
function renderTimeline(){const ev=state.events.slice();const meta=document.getElementById('timelineMeta');if(meta)meta.textContent='匹配 '+(state.eventsTotal??ev.length)+' 条 · 显示 '+ev.length+' 条（服务端筛选）';$('#timeline').innerHTML=ev.length?ev.map(e=>{let emo=parseJSON(e.emotion,{}),ents=parseJSON(e.entities,[]),tags=parseJSON(e.tags,[]);return `<div class="event-row"><div class="event-title">${esc(e.summary||e.title||e.content?.slice(0,80)||e.id)}</div><div class="event-meta">${esc((e.event_time||e.created_at||'').slice(0,19))} · ${ownerLabel(e.user_id||e.owner_id)} · ${esc(e.event_type||'')}</div><div class="tags">${[emo.primary,...ents.slice(0,5),...tags.slice(0,5)].filter(Boolean).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></div>`}).join(''):'<div class="sub">暂无事件</div>';}
function renderOwners(){const ps=state.data.compare?.persons||{};const entries=Object.entries(ps);$('#owners').innerHTML=(entries.length?entries:Object.entries(OWNER_LABEL).map(([id,label])=>[id,{label,event_count:0}])).map(([id,p])=>`<div class="owner-card" style="grid-column:span 6"><h2>${esc(p.label||ownerLabel(id))}</h2><div class="metric"><div class="num">${p.event_count??p.total??0}</div><div class="label">事件量</div></div><div class="sub">Top emotions</div><div class="tags">${Object.entries(p.top_emotions||p.emotions||{}).slice(0,10).map(([k,v])=>`<span class="tag">${esc(k)} ${v}</span>`).join('')}</div><div class="sub" style="margin-top:10px">Top tags</div><div class="tags">${Object.entries(p.top_tags||p.tags||{}).slice(0,10).map(([k,v])=>`<span class="tag">${esc(k)} ${v}</span>`).join('')}</div></div>`).join('');}
function renderDiaries(){const q=$('#diarySearch').value.trim().toLowerCase();let ds=state.diaries.filter(d=>!q||String(d.content||d.text||'').toLowerCase().includes(q));$('#diaries').innerHTML=ds.slice(0,80).map(d=>`<div class="event-row"><div class="event-meta">${esc((d.diary_date||d.created_at||'').slice(0,19))} · ${ownerLabel(d.owner_id||d.user_id)}</div><div>${esc((d.content||d.text||'').slice(0,280))}</div></div>`).join('')||'<div class="sub">暂无日记</div>';}
function renderLists(){const s=state.data.stats||{},sum=state.data.summary||{};const groups=[['实体',sum.top_entities||s.topEntities||[]],['情绪',Object.entries(s.byEmotion||{})],['类型',Object.entries(s.byType||{})]];$('#lists').innerHTML=groups.map(([name,arr])=>`<div class="owner-card"><h2>${name}</h2>${arr.slice(0,18).map(x=>{const k=Array.isArray(x)?x[0]:(x.name||x.entity||x.label);const v=Array.isArray(x)?x[1]:(x.count||x.value||'');return `<div class="kv"><span>${esc(k)}</span><b>${esc(v)}</b></div>`}).join('')}</div>`).join('');}
function renderMedia(){const ms=state.media||[];const el=document.getElementById('mediaWall');if(!el)return;el.innerHTML=ms.length?ms.map(m=>`<div class="media-cell"><img loading="lazy" src="${esc(window.XFEEL_AUTH.mediaURL('/media/'+m.id))}" alt=""><div class="media-meta">${esc((m.created_at||'').slice(0,16))} · ${ownerLabel(m.owner_id)}</div><div class="media-cap">${esc(m.caption||'（未转写）')}</div></div>`).join(''):'<div class="sub">还没有图片，让家人在微信发张照片试试 📷</div>';}window.XFEEL_AUTH.ensureLogin(async()=>{try{const me=await window.XFEEL_AUTH.authFetch('/web/me').then(r=>r.json());Object.assign(OWNER_LABEL,me&&me.owner_labels||{});if(me)renderOwnerFilter(me);if(me&&me.admin===false){document.querySelector('.content').innerHTML='<div class=\'card\' style=\'margin-top:24px\'><h2>需要管理员权限</h2><div class=\'sub\'>全局分析面板仅管理员可见。普通家庭成员请使用 <a href=\'/app\' style=\'color:var(--blue)\'>家的记忆</a>（已按你的家庭隔离）。</div></div>';document.getElementById('status').textContent='admin only';return;}}catch(e){}loadAll();setInterval(loadAll,refreshSec*1000);});
</script>
</body>
</html>
